# Redeploys the backend on Render after every push to main.
# Render cannot see pushes to this repository by itself (the Render service
# lives in another GitHub account), so this calls the service's Deploy Hook.
# Setup: Render -> yarnly-backend -> Settings -> Deploy Hook -> copy the URL,
# then GitHub -> Settings -> Secrets and variables -> Actions -> New secret
# named RENDER_DEPLOY_HOOK. Vercel deploys the storefront on its own.
name: Deploy backend to Render

on:
  push:
    branches: [main]
    paths:
      - "dtc-starter/apps/backend/**"
      - "dtc-starter/pnpm-lock.yaml"
      - "render.yaml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Call Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set; skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
