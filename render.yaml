# Render Blueprint for the Yarnly backend (Medusa API + Admin dashboard).
# The storefront runs on Vercel; the database lives on Supabase.
# Values marked "sync: false" are asked for when the Blueprint is created.
services:
  - type: web
    name: yarnly-backend
    runtime: node
    plan: free
    region: singapore
    branch: tien
    rootDir: dtc-starter
    # NODE_ENV=production would skip devDependencies (TypeScript, Vite) needed to build.
    buildCommand: >-
      npm install -g pnpm@10.11.1 &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @dtc/backend build
    # The build output resolves its packages from apps/backend/node_modules,
    # so it starts without a second install. The heap cap keeps Medusa inside
    # the free plan's 512 MB.
    startCommand: >-
      cd apps/backend/.medusa/server &&
      NODE_OPTIONS=--max-old-space-size=384
      node ../../node_modules/@medusajs/cli/cli.js start
    healthCheckPath: /health
    buildFilter:
      paths:
        - dtc-starter/apps/backend/**
        - dtc-starter/pnpm-lock.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # https://<backend>.onrender.com
      - key: MEDUSA_BACKEND_URL
        sync: false
      # https://<storefront>.vercel.app
      - key: STORE_CORS
        sync: false
      # https://<backend>.onrender.com
      - key: ADMIN_CORS
        sync: false
      # https://<backend>.onrender.com,https://<storefront>.vercel.app
      - key: AUTH_CORS
        sync: false
      # https://<storefront>.vercel.app/vn
      - key: STOREFRONT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FILE_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: GHN_API_URL
        value: https://dev-online-gateway.ghn.vn/shiip/public-api
      - key: GHN_API_TOKEN
        sync: false
      - key: GHN_SHOP_ID
        sync: false
      - key: GHN_WEBHOOK_TOKEN
        generateValue: true
